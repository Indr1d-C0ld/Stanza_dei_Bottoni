# Stanza dei Bottoni — configurazione Apache.
# Installata da deploy/01-apache.sh in conf-available/ e abilitata con a2enconf.

Alias /stanzadeibottoni /data/claude/StanzaDeiBottoni

<Directory /data/claude/StanzaDeiBottoni>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    RewriteEngine On
    RewriteBase /stanzadeibottoni
    # Le risorse statiche si servono da sole; tutto il resto al front controller.
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [QSA,L]
</Directory>

# Niente di tutto questo deve essere servito dal web.
<DirectoryMatch "/data/claude/StanzaDeiBottoni/(src|bin|db|config|calibrazione|storage|deploy|docs|tests)">
    Require all denied
</DirectoryMatch>
